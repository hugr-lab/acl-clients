name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  jdbc:
    name: JDBC driver
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Generated java.sql bases are what tools/GenForwarding.java makes
        working-directory: jdbc/tools
        run: |
          java GenForwarding.java
          test "$(ls out/*.java | wc -l)" -eq 8
          for f in out/*.java; do
            diff -u "../src/main/java/io/github/hugrlab/acl/jdbc/$(basename "$f")" "$f"
          done
          rm -rf out
      - name: Test and package
        working-directory: jdbc
        run: mvn -B package
      - name: duckdb-java's licence in both jars
        working-directory: jdbc
        run: |
          jars=$(ls target/acl-jdbc-*.jar | grep -v -e sources -e javadoc)
          test "$(echo "$jars" | wc -l)" -eq 2
          for jar in $jars; do
            unzip -l "$jar" META-INF/THIRD-PARTY.md | grep -q 'META-INF/THIRD-PARTY.md' \
              || { echo "no META-INF/THIRD-PARTY.md in $jar"; exit 1; }
          done
      - uses: actions/upload-artifact@v4
        with:
          name: acl-jdbc
          path: jdbc/target/acl-jdbc-*-all.jar

  dbeaver:
    name: DBeaver plugin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          # its own key: the jdbc job's (same poms otherwise) would win and the Tycho/p2 downloads never be cached
          cache-dependency-path: |
            dbeaver/**/pom.xml
            dbeaver/target-platform/*.target
      - name: The DBeaver release the plugin is built against
        uses: actions/cache@v4
        with:
          path: dbeaver/.dbeaver
          key: dbeaver-${{ hashFiles('dbeaver/dbeaver.version') }}
      - name: Build, unit and UI tests (Xvfb; the live tests skip without a node)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq xvfb libgtk-3-0t64 > /dev/null
          xvfb-run -a dbeaver/build.sh clean verify
      - name: Install check (p2 director into a copy of that DBeaver)
        run: xvfb-run -a dbeaver/install-check.sh
      - uses: actions/upload-artifact@v4
        with:
          name: acl-dbeaver-p2
          path: dbeaver/io.github.hugrlab.acl.dbeaver.site/target/*.zip

  examples:
    name: Examples build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: Go
        working-directory: examples/go
        run: go vet ./... && go build ./...
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Python
        run: python -m py_compile examples/python/connect.py
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: .NET
        working-directory: examples/dotnet
        run: dotnet build -c Release
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Java
        working-directory: examples/java
        run: mvn -B -q compile
