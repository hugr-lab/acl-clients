[project]
name = "acl-openmetadata"
version = "0.1.0"
description = "An OpenMetadata connector for duckdb-acl nodes: the catalog a principal reads, and its definition lineage"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10,<3.12"
dependencies = [
    "openmetadata-ingestion~=2.0.5",
    "adbc-driver-flightsql>=1.0",
    "adbc-driver-manager>=1.0",
    "pyarrow>=14",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
